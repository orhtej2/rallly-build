name: Build new Rallly releases

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest Rallly release tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            tag=$(gh api repos/lukevella/rallly/releases/latest --jq .tag_name 2>/dev/null || true)

            if [ -n "$tag" ] && [ "$tag" != "null" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "Unable to determine the latest Rallly release tag." >&2
          exit 1

      - name: Check whether the tag exists here
        id: local
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start build for the new tag
        if: steps.local.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          gh workflow run build-rallly.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field source_repo=lukevella/rallly \
            --field target_repo="$GITHUB_REPOSITORY" \
            --field tag="$TAG"
