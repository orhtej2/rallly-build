name: Build release artifact

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Repository to fetch source from, e.g. lukevella/rallly
        required: true
        type: string
      target_repo:
        description: Repository that owns the release to upload to, e.g. my-org/release-host
        required: true
        type: string
      tag:
        description: Release tag to build/upload
        required: true
        type: string
      artifact_prefix:
        description: Prefix for architecture-specific release assets
        required: false
        default: rallly-web-release
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the release already has both artifacts
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url="https://api.github.com/repos/${{ inputs.target_repo }}/releases/tags/${{ inputs.tag }}"
          release_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$release_url")

          if [ "$release_status" = "404" ]; then
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$release_status" != "200" ]; then
            echo "Unable to check target release: HTTP $release_status" >&2
            exit 1
          fi

          release_json=$(gh api "repos/${{ inputs.target_repo }}/releases/tags/${{ inputs.tag }}")
          release_id=$(echo "$release_json" | jq -r '.id')
          echo "release_exists=true" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

          asset_count=$(echo "$release_json" | jq '[.assets[] | select(
            .name == "${{ inputs.artifact_prefix }}-amd64.tar.gz" or
            .name == "${{ inputs.artifact_prefix }}-arm64.tar.gz"
          )] | length')

          if [ "$asset_count" -eq 2 ]; then
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export published Docker image artifacts
        if: steps.existing.outputs.skip_build == 'false'
        run: |
          set -euo pipefail
          image_tag="${{ inputs.tag }}"
          image_tag="${image_tag#v}"

          for architecture in amd64 arm64; do
            image="lukevella/rallly:$image_tag"
            container="rallly-$architecture"
            artifact="${{ inputs.artifact_prefix }}-$architecture.tar.gz"

            docker pull --platform "linux/$architecture" "$image"
            docker create --name "$container" "$image"
            mkdir -p "dist/$architecture"
            docker cp "$container:/app/." "dist/$architecture"
            docker rm "$container"
            tar -C "dist/$architecture" -czf "$artifact" .
          done

      - name: Create target release if missing
        if: steps.existing.outputs.skip_build == 'false' && steps.existing.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "${{ inputs.target_repo }}" \
            --title "${{ inputs.tag }}" \
            --notes "Automated release artifact for [${{ inputs.tag }}](https://github.com/${{ inputs.source_repo }}/releases/tag/${{ inputs.tag }})."

      - name: Upload artifact to release
        if: steps.existing.outputs.skip_build == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "${{ inputs.artifact_prefix }}-amd64.tar.gz" \
            "${{ inputs.artifact_prefix }}-arm64.tar.gz" \
            --repo "${{ inputs.target_repo }}" \
            --clobber